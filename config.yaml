# Bengaluru Road Safety ML Project - Central Configuration

project:
  name: "Bengaluru_Road_Safety_ML"
  version: "1.0.0"
  description: "Remote GPU ML project for Bengaluru Road Safety and Damage Assessment"

# Hardware Safety Settings
hardware:
  require_cuda: true
  allow_cpu_training: false  # Strict rule: Heavy training must NOT run on CPU

# Paths Configuration (Auto-handled for local Windows and remote Google Colab)
paths:
  local_root: "."
  colab_drive_root: "/content/drive/MyDrive/Bengaluru_Road_Safety"
  raw_dataset_dir: "dataset/RDD2022-India.v1i.darknet"
  yolo_dataset_dir: "dataset/rdd2022_yolo"
  experiments_dir: "experiments"
  checkpoints_dir: "checkpoints"
  models_dir: "models"

# Dataset Specification: RDD2022 Four-Class Model
rdd2022:
  num_classes: 4
  class_names:
    0: "D00"  # Longitudinal Crack
    1: "D10"  # Transverse Crack
    2: "D20"  # Alligator Crack
    3: "D40"  # Pothole
  descriptions:
    D00: "Longitudinal Crack"
    D10: "Transverse Crack"
    D20: "Alligator Crack"
    D40: "Pothole"

# YOLO11s Training Hyperparameters
training:
  model_name: "yolo11s.pt"  # Initial model for Road Damage Detection
  epochs: 50
  batch_size: 16
  imgsz: 512
  workers: 4
  optimizer: "auto"
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  patience: 15
  save_period: 5
  seed: 42

# Evaluation & Metrics Thresholds
evaluation:
  conf_threshold: 0.25
  iou_threshold: 0.45
  metrics:
    - "Precision"
    - "Recall"
    - "mAP50"
    - "mAP50-95"

# Google Drive Persistence Settings
drive_persistence:
  enabled_on_colab: true
  sync_weights: true
  sync_metrics: true
  sync_plots: true
